  # ------------------------------------------------------------------
  # Polymarket US (QCX LLC d/b/a Polymarket US) — direct API route.
  # Current fee schedule directly re-read 2026-10-10; effective 2026-10-07
  # at 10:00 ET (not the superseded 2026-07-01 schedule).
  #
  # Published reference formulas:
  #   standard taker Θ = 0.0695; Table Tennis taker Θ = 0.10;
  #   maker rebate Θ = -0.0125; combos use a separate taker curve and have
  #   no maker rebate. Standard fee = Θ × C × p × (1-p).
  #   Combo fee = C × p × [0.0695 × (1-p) + 0.06 × (1-p)^4].
  # The current adapter/evaluator does not select these fee families, so the
  # reference coefficients below are NOT execution-ready.
  #
  # Direct documentation also establishes per-fill banker's rounding, a
  # cumulative exact-fee cap for aggressive orders (only reduces charges),
  # and independent per-fill maker rebates. Volume rebates are based on prior
  # calendar-month taker amount-at-risk (or separately evidenced accelerated
  # placement) and paid weekly; they are never per-trade discounts. The fee
  # page lists 10% / 25% / 50% tiers at $250k /
  # $1m / $10m and defines buy/sell volume as C×p / C×(1-p).
  #
  # The 99-row standard 100-lot table and rounding/cap arithmetic are tested
  # with a test-only synthetic schedule. Production trade AND settlement
  # statuses remain INCOMPLETE: category/combination fee selection, actual
  # order/fill context and customer settlement treatment are not established.
  - venue: polymarket_us
    version: "2026-10-07-effective"
    effective_date: "2026-10-07"
    expiration_date: null
    verified_at: "2026-10-10"
    verification_status: VERIFIED
    documentation_tested: true
    live_test_status: UNAVAILABLE
    source: "https://docs.polymarket.us/fees; https://docs.polymarket.us/changelog; https://docs.polymarket.us/api-reference/market/overview; https://docs.polymarket.us/api-reference/combos/overview; https://docs.polymarket.us/learn/markets/contract-settlement; https://docs.polymarket.us/institutional/funding/overview; https://docs.polymarket.us/api-reference/funding/get-account-balance-ledger; https://docs.polymarket.us/institutional/payments/overview; https://docs.polymarket.us/trader-guide/reporting"
    currency: USD
    rounding: half_even
    order_fee_cap: cumulative_exact_rounded
    trade_calculation_status: INCOMPLETE
    settlement_calculation_status: INCOMPLETE
    fee_context:
      series: "fee family required: standard, Table Tennis, or combo"
      listing_cohort: "current; schedule effective 2026-10-07 10:00 ET"
      event_status: "market/product type must be identified; combo uses separate instrument endpoint"
      contract_type: "standard binary, Table Tennis, or 2-50-leg combo; distinct fee rules"
      access_route: "direct Polymarket US Retail API (QCX DCM); account fee reports required for reconciliation"
      account_or_fill_state: "actual fill partition/order cap; maker rebate per fill; prior-month tier or documented accelerated placement is not a per-order discount"
    required_context:
      - fee_family
      - raw_market_fee_classification
      - combo_instrument_support_or_explicit_exclusion
      - actual_order_fill_partition
      - cumulative_exact_order_fee
      - prior_month_or_approved_accelerated_rebate_tier_for_reporting_only
      - settlement_fee_treatment
      - account_fee_report
      - metadata_verified_at
    blocking_reason: >-
      The standard formula alone is not a universal schedule: Table Tennis has
      a higher taker coefficient and Retail API combos have a separate curve
      with no maker rebate. The adapter collapses sports to a generic category,
      the two-leg fee call receives no fee-family context, and combo instruments
      are not modelled. The reviewed settlement materials do not establish
      customer settlement-fee treatment. INCOMPLETE prevents using the
      standard coefficient as an estimate.
    published_reference:
      standard_taker_theta: "0.0695"
      table_tennis_taker_theta: "0.10"
      maker_rebate_theta: "-0.0125"
      combo_taker_formula: "C × p × [0.0695 × (1-p) + 0.06 × (1-p)^4]"
      combo_maker_rebate: "none"
      volume_rebate_tiers: "10% at $250,000; 25% at $1,000,000; 50% at $10,000,000 prior-calendar-month taker volume"
      volume_definition: "amount at risk: C×p for buys and C×(1-p) for sells; paid weekly, not per trade"
      accelerated_tier_placement: "venue permits verifiable trailing-30-day external prediction-market volume to support tier placement; requires account evidence and is not assumed"
      settlement_fee_treatment: UNKNOWN
    fees:
      # Standard-family arithmetic reference only. Do not promote to COMPLETE
      # until family selection, order context and settlement are resolved.
      - fee_type: taker_quadratic_reference
        multiplier: "0.0695"
        applies_to: taker
      - fee_type: maker_rebate_quadratic_reference
        multiplier: "-0.0125"
        applies_to: maker
    rebate_policy: "Volume tiers use prior-calendar-month taker amount-at-risk (C×p on buys; C×(1-p) on sells), paid weekly; the venue documents accelerated placement from verifiable trailing-30-day external volume. Both bases require account evidence and are recorded only, never applied as per-order discounts."
    volume_rebate_tiers:
      - threshold: "250000"
        rebate: "0.10"
      - threshold: "1000000"
        rebate: "0.25"
      - threshold: "10000000"
        rebate: "0.50"

