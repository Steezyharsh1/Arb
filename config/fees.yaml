# Versioned fee evidence ledger (§24), re-verified 2026-09-13.
#
# Safety rule: a published headline rate is not enough to make a schedule
# executable. trade_calculation_status / settlement_calculation_status must be
# COMPLETE before FeeCalculator returns a value. INCOMPLETE always raises
# FEE_DATA_INCOMPLETE. Context dimensions are recorded even when they are not
# yet supplied by adapters so no one silently promotes a venue-wide estimate.
schema_version: 2

schedules:
  - venue: kalshi
    version: "2026-07-07-snapshot"
    effective_date: "2026-07-07"
    expiration_date: null
    verified_at: "2026-09-13"
    verification_status: VERIFIED
    documentation_tested: true
    live_test_status: UNAVAILABLE
    source: "https://kalshi.com/fee-schedule; https://docs.kalshi.com/getting_started/fee_rounding; https://docs.kalshi.com/api-reference/market/get-series; https://docs.kalshi.com/api-reference/exchange/get-series-fee-changes"
    currency: USD
    trade_calculation_status: INCOMPLETE
    settlement_calculation_status: COMPLETE
    fee_context:
      series: "dynamic: series_ticker"
      listing_cohort: "all current listings; series/event overrides apply"
      event_status: "event fee override may change over lifecycle"
      contract_type: "$1 event contract; margin contracts excluded"
      access_route: "direct Kalshi member route"
      account_or_fill_state: "balance precision + per-order rounding accumulator"
    required_context:
      - series
      - event_status
      - contract_type
      - access_route
      - fee_type
      - fee_multiplier
      - account_balance_precision
      - cumulative_fill_quantity
      - cumulative_fee_charged
      - metadata_verified_at
    blocking_reason: "series/event fee type and multiplier, account balance precision, walked fill partition, and per-order rounding accumulator are not supplied to FeeCalculator"
    fees:
      # Reference formulas only. The INCOMPLETE status prevents execution use.
      - fee_type: taker_quadratic_reference
        multiplier: "0.07"
        applies_to: taker
      - fee_type: maker_quadratic_reference
        multiplier: "0.0175"
        applies_to: maker
      - fee_type: settlement
        fixed_amount: "0.00"
        applies_to: settlement

  - venue: forecast_ex
    version: "2026-03-24"
    effective_date: "2026-03-24"
    expiration_date: null
    verified_at: "2026-09-13"
    verification_status: VERIFIED
    documentation_tested: true
    live_test_status: UNAVAILABLE
    source: "https://www.cftc.gov/filings/orgrules/rules03022640215.pdf; https://www.cftc.gov/filings/orgrules/rules03242641956.pdf; https://www.interactivebrokers.com/en/pricing/commissions-events.php"
    currency: USD
    trade_calculation_status: COMPLETE
    settlement_calculation_status: COMPLETE
    fee_context:
      series: "all ForecastEx $1 forecast-contract series"
      listing_cohort: "current rulebook"
      event_status: "all"
      contract_type: "$1 binary Forecast Contract"
      access_route: "IBKR ForecastTrader / ForecastEx"
    fees:
      # Opposite bids pair at $1.00. This separate fee applies to each
      # executed side; it is not embedded in a $1.01 pairing threshold.
      - fee_type: exchange_fee_per_executed_contract
        fixed_amount: "0.01"
        applies_to: taker
      - fee_type: maker_not_distinguished
        fixed_amount: "0.01"
        applies_to: maker
      - fee_type: settlement
        fixed_amount: "0.00"
        applies_to: settlement

