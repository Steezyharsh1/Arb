# Versioned fee evidence ledger (§24). Active-route sources re-reviewed 2026-10-10.
# `verified_at` remains per-schedule; routes not re-reviewed on that date keep
# their older verification date. `verification_status: VERIFIED` means the
# cited public evidence was inspected; it does not mean all-in fees, account
# state, or executable calculations are verified.
#
# Safety rule: a published headline rate is not enough to make a schedule
# executable. Both calculation statuses must be COMPLETE before FeeCalculator
# returns a value. INCOMPLETE always raises FEE_DATA_INCOMPLETE. Rates under
# `fees` on INCOMPLETE schedules are documentation references only, never
# execution-facing estimates.
schema_version: 2

schedules:
  - venue: kalshi
    version: "2026-10-10-reference-snapshot"
    effective_date: null
    reference_snapshot_date: "2026-10-10"
    expiration_date: null
    verified_at: "2026-10-10"
    verification_status: VERIFIED
    documentation_tested: true
    live_test_status: UNAVAILABLE
    source: "https://kalshi.com/fee-schedule; https://docs.kalshi.com/getting_started/fee_rounding; https://docs.kalshi.com/api-reference/market/get-series; https://docs.kalshi.com/api-reference/exchange/get-series-fee-changes; https://docs.kalshi.com/api-reference/events/get-event; https://docs.kalshi.com/api-reference/events/get-event-fee-changes; https://docs.kalshi.com/getting_started/market_settlement"
    currency: USD
    trade_calculation_status: INCOMPLETE
    settlement_calculation_status: INCOMPLETE
    fee_context:
      series: "series_ticker fee_type and fee_multiplier; scheduled series changes"
      listing_cohort: "effective series fee schedule at evaluation time"
      event_status: "event fee_type_override/fee_multiplier_override and scheduled event changes"
      contract_type: "binary yes/no versus scalar/sub-cent settlement; market_type"
      access_route: "direct versus non-direct member account"
      account_or_fill_state: "member balance precision, actual per-fill prices/quantities, per-order accumulator and balance-alignment adjustments"
    required_context:
      - series_ticker
      - event_ticker
      - series_fee_type
      - series_fee_multiplier
      - event_fee_type_override
      - event_fee_multiplier_override
      - fee_change_effective_timestamp
      - market_type
      - access_route
      - account_balance_precision
      - actual_fill_prices_and_quantities
      - order_fee_accumulator_state
      - settlement_type
      - metadata_verified_at
    blocking_reason: >-
      Public documentation establishes the reference formula and rounding, but
      the adapter/calculator do not resolve series and event fee state, member
      precision, or actual account order-accumulator state. The book is
      price-aggregated and does not reveal future individual fills. Settlement
      is documented as zero only for simple yes/no determinations; sub-cent
      scalar settlement may incur a fee. Keep both components blocked until
      context is represented and validated.
    published_settlement_scope:
      simple_yes_no: "zero settlement fee is documented for simple yes/no determinations"
      scalar_subcent: "a settlement fee may apply; no general zero-fee claim"
      execution_use: "reference only; evaluator does not enforce this contract-type boundary"
    fees:
      # Published reference formulas only; INCOMPLETE status blocks use.
      - fee_type: taker_quadratic_reference
        multiplier: "0.07"
        applies_to: taker
      - fee_type: maker_quadratic_reference
        multiplier: "0.0175"
        applies_to: maker

