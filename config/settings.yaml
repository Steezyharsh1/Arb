# Global settings. Mode-specific files (historical.yaml/paper.yaml/live.yaml)
# override/extend these. CLI --mode overrides the file.
schema_version: 1

mode: paper   # default mode is paper (§95). Never defaults to live.

arbitrage:
  guaranteed_only: true          # only TYPE_A / TYPE_B eligible for execution
  minimum_net_profit: 2.00       # dollars (§42)
  minimum_net_return: 0.005      # 0.5%
  minimum_liquidity_ratio: 0.90
  maximum_book_age_ms: 1000
  maximum_execution_latency_ms: 500
  maximum_settlement_delay_days: 5

# Hard execution-risk limits have one authoritative source:
# config/risk_limits.yaml. Do not duplicate them here; the former copy used
# the mismatched key `max_trade_capital` and was not the paper execution input.

execution:
  max_book_age_ms: 1000
  max_execution_latency_ms: 500
  preferred_order_type: LIMIT
  allow_market_orders: false

compliance:
  jurisdiction: US-UT
  block_unknown_status: true
  block_unknown_venue_relationship: true

cost_of_capital:
  annual_rate: 0.05

fees:
  # Mandatory fee-freshness limit (§98, prediction_arb/fees/freshness.py).
  # A schedule whose `verified_at` is older than this is REFUSED by every
  # execution-facing mode — live and paper — exactly like a missing one, so
  # its opportunities BLOCK with the age in the reason instead of being
  # costed on evidence nobody has re-read. Historical replay still costs a
  # stale schedule (replaying recorded history with the schedule that was
  # current then is more useful than refusing to measure it) and labels the
  # run RESEARCH USE ONLY; collect mode never calculates fees at all.
  max_schedule_age_days: 30

# Advisory readiness report (`--readiness`, §58/§99). Every criterion that
# report prints is derived from verified system state — adapter status,
# provenance independence, the recorded store, the fee ledger, settlement
# timing evidence, compliance and risk configuration. These numbers are the
# evidence thresholds that state is compared against; changing them changes
# what the report requires, and never enables live trading by itself.
readiness:
  minimum_recorded_snapshots: 1000       # recorded order-book snapshots
  minimum_analyzed_opportunities: 50     # opportunities the pipeline analyzed
  minimum_live_capable_venues: 2         # VERIFIED API + verified order types
  minimum_data_venues: 2                 # VERIFIED API (paper needs a pair)

# LLM semantic matcher (§19, §97). Credentials come only from the mode env
# file: LLM_API_BASE / LLM_API_KEY / LLM_MODEL (docs/API_SETUP.md). With no
# LLM configured, matching stays conservative — every ambiguous pair ends
# in REVIEW and nothing is auto-APPROVED.
llm:
  # Bound on NEW LLM comparisons per scan cycle. Pairs beyond the budget
  # fail closed to REVIEW instead of running an unbounded bill; cache hits
  # never consume budget.
  max_comparisons_per_cycle: 200

scanner:
  poll_interval_seconds: 10
  max_markets_per_venue: 500
