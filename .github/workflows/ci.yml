name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests + CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test suite (units, safety, failure modes, spec §75 cases)
        run: pytest

      - name: CLI smoke — venue status (no network, no credentials)
        run: python -m prediction_arb.main --status

      - name: CLI smoke — `python -m prediction_arb` alias
        run: python -m prediction_arb --status

      - name: CLI smoke — installed console script
        run: prediction-arb --status

      # Readiness must be derived from observed state, must stay advisory, and
      # must leave no side effects behind (§58, §98–§100; defects D10/D19).
      - name: CLI smoke — readiness is derived, advisory and side-effect free
        run: |
          # Snapshot the runtime tree first. The test suite above legitimately
          # leaves an empty data/paper/ behind (tests/test_paths.py,
          # tests/test_phase4_recording.py), so what this step may assert is
          # the *delta* --readiness produces, not an untouched working copy.
          before=$(find data logs reports -mindepth 1 2>/dev/null | sort)
          python -m prediction_arb.main --readiness > /tmp/readiness.out
          after=$(find data logs reports -mindepth 1 2>/dev/null | sort)
          grep -q "Fee-freshness policy per mode" /tmp/readiness.out
          grep -q "live=MANDATORY, paper=MANDATORY" /tmp/readiness.out
          grep -q "historical=RESEARCH, collect=NOT_APPLICABLE" /tmp/readiness.out
          grep -q "LIVE MODE: NOT RECOMMENDED YET" /tmp/readiness.out
          grep -q "Advisory only" /tmp/readiness.out
          grep -q "blockers (detail above)" /tmp/readiness.out
          # The old probe created data/paper/ and opened a SQLite store just to
          # count rows in it (D10). A readiness *report* must create nothing:
          # it opens the recorded store read-only if it already exists.
          if [ "$before" != "$after" ]; then
            echo "::error::--readiness changed the runtime tree:"
            diff <(printf '%s\n' "$before") <(printf '%s\n' "$after") || true
            exit 1
          fi
          test ! -e data/paper/prediction_arb_paper.sqlite3

      # Historical mode must say "no data" honestly rather than fabricate
      # history or fall back to live data (§55, §92).
      - name: CLI smoke — empty historical replay stays honest
        run: |
          python -m prediction_arb.main --mode historical --date 2020-01-01 \
            | tee /tmp/historical.out
          grep -q "No recorded historical order-book data" /tmp/historical.out

      - name: Repo hygiene — no build artifacts, databases or env files tracked
        run: |
          bad=$(git ls-files \
                  | grep -E '(^|/)__pycache__/|\.pyc$|\.sqlite3$|(^|/)data/|(^|/)logs/|(^|/)reports/' || true)
          # .env.example is a template and is deliberately tracked; any other
          # .env* file is a secret and must never be.
          bad="$bad$(git ls-files | grep -E '^\.env\.' | grep -v '^\.env\.example$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Runtime artifacts or secrets are tracked in git:"
            echo "$bad"
            exit 1
          fi
          echo "OK: no artifacts, databases, logs or env files are tracked."
