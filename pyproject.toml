[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-arb"
version = "1.0.0"
description = "Multi-venue prediction-market arbitrage engine: safety-first, mode-isolated, honest about UNKNOWN."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
keywords = ["prediction-markets", "arbitrage", "kalshi", "forecastex", "trading"]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
prediction-arb = "prediction_arb.main:main"

[tool.setuptools]
# Code lives in prediction_arb/; config/, data/, logs/, reports/, docs/,
# tests/ and scripts/ stay at the project root (see prediction_arb/core/paths.py).
packages = { find = { include = ["prediction_arb*"] } }
include-package-data = false

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
